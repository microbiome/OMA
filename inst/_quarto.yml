project:
  type: book
  output-dir: docs
  post-render: assets/post-render.R
# Re-run a chapter's code only when its source has changed. Results are
# stored in inst/_freeze/ (not in git), so CI always renders from scratch.
# Delete inst/_freeze/ to force a full re-run, e.g. after package updates.
execute:
  freeze: auto
mathjax: null
filters:
  - at: pre-ast
    path: assets/callouts.lua
metadata-files:
  - assets/_book.yml
  - assets/_website.yml
  - assets/_format.yml
  - assets/_knitr.yml
