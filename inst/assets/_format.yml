format: 
  html:
    toc: false
    # Scroll the long sidebar to the chapter being read when a page opens.
    # Only the sidebar scrolls, not the page.
    include-after-body:
      text: |
        <script>
        window.addEventListener("load", function () {
          var sb = document.getElementById("quarto-sidebar");
          var a = sb && sb.querySelector(".sidebar-link.active");
          if (!a || sb.scrollHeight <= sb.clientHeight) return;
          var offset = a.getBoundingClientRect().top - sb.getBoundingClientRect().top;
          sb.scrollTop += offset - sb.clientHeight / 4;
        });
        // Make the whole "doi:10.xxx" of a reference clickable. The citation
        // style prints "doi:" as plain text right before the DOI link.
        document.addEventListener("DOMContentLoaded", function () {
          document.querySelectorAll('.csl-entry a[href^="https://doi.org/"]').forEach(function (a) {
            var t = a.previousSibling;
            if (t && t.nodeType === 3 && /doi:$/.test(t.nodeValue)) {
              t.nodeValue = t.nodeValue.slice(0, -4);
              a.textContent = "doi:" + a.textContent;
            }
          });
        });
        </script>
    grid:
      sidebar-width: 500px
      body-width: 900px
    theme:
      - assets/book.scss
    mainfont: "Atkinson Hyperlegible, sans-serif"
    highlight-style: a11y
    mermaid:
      theme: neutral
    code-link: true
    bibliography: assets/bibliography.bib
    csl: assets/oma.csl
    citation-abbreviations: assets/journal-abbreviations.json
    citation-location: margin
    from: markdown+emoji
