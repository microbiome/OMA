format: 
  html:
    toc: true
    toc-depth: 3
    toc-expand: true
    toc-location: left
    include-after-body: assets/sidebar-toc.html
    grid:
      sidebar-width: 400px
      body-width: 1000px
    theme:
      light:
        - assets/book.scss
      dark: darkly
    mainfont: "Atkinson Hyperlegible, sans-serif"
    highlight-style: atom-one
    code-link: true
    editor: visual
    bibliography: assets/bibliography.bib
    citation-location: margin
    from: markdown+emoji
