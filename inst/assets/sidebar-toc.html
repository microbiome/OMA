<script>
// Show the current chapter's sections in the left sidebar, directly under
// the active chapter (OSCA style). Quarto places the page TOC at the end of
// the sidebar when toc-location is "left"; here we move it under the
// active chapter link. Scroll highlighting keeps working because Quarto
// finds the TOC by its id.
document.addEventListener("DOMContentLoaded", function () {
  var toc = document.getElementById("TOC");
  var active = document.querySelector("#quarto-sidebar .sidebar-link.active");
  if (!toc || !active) return;
  var item = active.closest("li.sidebar-item");
  if (!item) return;
  var title = toc.querySelector("#toc-title");
  if (title) title.remove();
  toc.classList.add("sidebar-chapter-toc");
  item.appendChild(toc);
});
</script>
