knitr:
  opts_chunk: 
    collapse: true
    comment: "## " 
    cache: false
    # Book-wide defaults, set here instead of in a setup chunk per chapter.
    message: false
    warning: false
    error: false
    fig.align: "center"
    # Draw figures with cairo. Some systems default to Xlib, which cannot
    # draw semi-transparent colours (e.g. points in scater plots disappear).
    dev.args:
      type: "cairo-png"
    python.reticulate: false
    R.options:
      digits: 4
      dplyr.print_min: 6
      dplyr.print_max: 6
      pillar.max_footer_lines: 2
      pillar.min_chars: 15
      stringr.view_n: 6
      pillar.bold: TRUE
      width: 77 # 80 - 3 for #> comments
      # Colour-blind-friendly palettes for figures: Okabe-Ito (without black)
      # for groups and viridis for continuous values. See "Colours in
      # figures" in the Getting started chapter.
      ggplot2.discrete.colour: ["#E69F00", "#56B4E9", "#009E73", "#F0E442", "#0072B2", "#D55E00", "#CC79A7", "#999999"]
      ggplot2.discrete.fill: ["#E69F00", "#56B4E9", "#009E73", "#F0E442", "#0072B2", "#D55E00", "#CC79A7", "#999999"]
      ggplot2.continuous.colour: viridis
      ggplot2.continuous.fill: viridis
