on:
  pull_request:
    branches:
      - devel
      - RELEASE_**
    paths: ["**.[rR]", "**.[qrR]md", "**.[rR]markdown"]
  workflow_dispatch:
  push:
name: Convert British English spelling into American English spelling
permissions: read-all
jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Convert from American English to British English
        run: bash .github/workflows/convert-british-to-american.sh
      - name: Commit and push changes
        run: |
          git config --local user.name "$GITHUB_ACTOR"
          git config --local user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git add -u
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Convert from British to American English"
            git diff HEAD~1
            # git push origin HEAD:${{ github.head_ref }}
          fi
