name: Check package list

# oma_packages/oma_packages.csv lists the packages needed to run the book
# (the Suggests field of DESCRIPTION). Readers install them with the code in
# the Getting started chapter or install_packages.R, which download the file
# from the devel branch. This check fails when the file is out of date.
#
# To update the file, run in the oma_packages folder:
#   Rscript extract_packages.R
# and commit oma_packages.csv in the same pull request.

on:
  pull_request:
    branches:
      - devel
    paths:
      - 'DESCRIPTION'
      - 'oma_packages/**'
  push:
    branches:
      - devel
    paths:
      - 'DESCRIPTION'
      - 'oma_packages/**'

# A newer push to the same pull request or branch cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check_packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Regenerate the package list
        working-directory: ./oma_packages
        run: Rscript extract_packages.R

      - name: Check that the package list is up to date
        run: |
          if ! git diff --exit-code -- oma_packages/oma_packages.csv; then
            echo "::error file=oma_packages/oma_packages.csv::oma_packages.csv does not match the Suggests field of DESCRIPTION. Run 'Rscript extract_packages.R' in the oma_packages folder and commit oma_packages.csv."
            exit 1
          fi
